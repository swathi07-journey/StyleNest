<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | StyleNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/wishlist.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wishlist-page">
    <div class="wishlist-heading"><p class="eyebrow">SAVED FOR LATER</p><h1>My Wishlist</h1><p class="wishlist-subtitle">Your favourite pieces, all in one place.</p></div>
    <div class="wishlist-toolbar"><span id="wishlist-count">0 items</span><a href="shop.html">Continue shopping <span aria-hidden="true">→</span></a></div>
    <section id="wishlist-grid" class="wishlist-grid" aria-live="polite"></section>
    <section id="wishlist-empty" class="wishlist-empty" hidden><div class="empty-heart">♡</div><h2>Your wishlist is waiting</h2><p>Save the pieces you love and find them here whenever you're ready.</p><a class="wishlist-shop-btn" href="shop.html">Explore the collection</a></section>
  </main>
  <div id="site-footer"></div>
 <script src="js/main.js"></script>
<script src="js/products.js"></script>
<script src="js/wishlist.js"></script>
</body></html>
